# Replace stage names/certificate paths on an isolated test host. Repeat for B
# with ports 23000/23006/23002. Admin, interaction and introspection ports stay private.
server {
  listen 443 ssl;
  server_name pay-a.stage.example;
  ssl_certificate /etc/letsencrypt/live/pay-a.stage.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pay-a.stage.example/privkey.pem;
  location / { proxy_pass http://127.0.0.1:13000; proxy_set_header X-Forwarded-Proto https; proxy_set_header Host $host; }
}
server {
  listen 443 ssl;
  server_name auth-a.stage.example;
  ssl_certificate /etc/letsencrypt/live/auth-a.stage.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/auth-a.stage.example/privkey.pem;
  location / { proxy_pass http://127.0.0.1:13006; proxy_set_header X-Forwarded-Proto https; proxy_set_header Host $host; }
}
