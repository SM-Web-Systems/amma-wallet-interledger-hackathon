# TEST-ONLY TLS front for compose.local-tls.yml. Only the public Open Payments
# and GNAP auth ports are exposed; admin, interaction, introspection and
# connector ports stay on the private Compose network.
map $host $amma_upstream {
  pay-a.amma.test  http://peer-a:3000;
  auth-a.amma.test http://auth-a:3006;
  pay-b.amma.test  http://peer-b:3000;
  auth-b.amma.test http://auth-b:3006;
}
resolver 127.0.0.11 valid=10s;
server {
  listen 443 ssl;
  server_name pay-a.amma.test auth-a.amma.test pay-b.amma.test auth-b.amma.test;
  ssl_certificate /etc/nginx/tls/server.pem;
  ssl_certificate_key /etc/nginx/tls/server.key;
  location / {
    proxy_pass $amma_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
server {
  listen 443 ssl default_server;
  ssl_certificate /etc/nginx/tls/server.pem;
  ssl_certificate_key /etc/nginx/tls/server.key;
  return 421;
}
